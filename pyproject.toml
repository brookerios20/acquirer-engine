[project]
name = "acquirer-engine"
version = "0.1.0"
description = "Ranks likely acquirers for a target company and drafts a one-page rationale for each"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pandas",
    "pydantic",
    "python-dotenv",
]

[project.scripts]
acquirers = "acquirer_engine.controllers.cli_controller:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acquirer_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
